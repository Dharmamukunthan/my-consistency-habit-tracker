name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "consistency-habit-tracker",
            "version": "2.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "8.4.2"
            },
            "devDependencies": {
              "@capacitor/cli": "8.4.2"
            }
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install
          npm install @capacitor/android@8.4.2

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.consistency.habittracker",
            "appName": "Consistency Habit Tracker",
            "webDir": "www"
          }
          EOF

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/
          cp icon.svg www/

          echo "Web assets:"
          ls -la www

      - name: Validate Capacitor configuration
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const config = JSON.parse(
            fs.readFileSync("capacitor.config.json", "utf8")
          );

          if (config.appId !== "com.consistency.habittracker") {
            throw new Error("Invalid appId");
          }

          if (config.webDir !== "www") {
            throw new Error("Invalid webDir");
          }

          if (!fs.existsSync("www/index.html")) {
            throw new Error("www/index.html is missing");
          }

          console.log("Capacitor configuration is valid.");
          NODE

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Check Android project
        run: |
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/src/main/assets/capacitor.config.json
          test -f android/app/src/main/assets/capacitor.plugins.json

          echo "Android project checks passed."

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release-keystore.jks"

          test -s "$RUNNER_TEMP/release-keystore.jks"

          echo "Signing keystore restored."

      - name: Verify signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "Signing secrets are present."

      - name: Build signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android

          chmod +x gradlew

          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release-keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

      - name: Find Release APK
        run: |
          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not created."
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          cp "$APK" consistency-habit-tracker-v2.0.apk

          echo "Release APK found:"
          ls -lh consistency-habit-tracker-v2.0.apk

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" \
            verify \
            --verbose \
            consistency-habit-tracker-v2.0.apk

          echo "APK signature verification passed."

      - name: Verify APK package
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" \
            dump badging \
            consistency-habit-tracker-v2.0.apk | head -n 5

          echo "APK package verification passed."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Consistency-Habit-Tracker-v2.0-Signed
          path: consistency-habit-tracker-v2.0.apk
          if-no-files-found: error
          retention-days: 30
