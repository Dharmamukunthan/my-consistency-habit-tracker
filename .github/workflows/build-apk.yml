name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "consistency-habit-tracker",
            "version": "2.0.0",
            "private": true,
            "scripts": {
              "cap": "cap"
            },
            "dependencies": {
              "@capacitor/core": "8.4.2"
            },
            "devDependencies": {
              "@capacitor/cli": "8.4.2"
            }
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install
          npm install @capacitor/android@8.4.2

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.consistency.habittracker",
            "appName": "Consistency Habit Tracker",
            "webDir": "."
          }
          EOF

      - name: Validate Capacitor configuration
        run: |
          node -e "const c=require('./capacitor.config.json'); if(c.appId!=='com.consistency.habittracker') process.exit(1); if(c.webDir!=='.') process.exit(1); console.log(c)"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Check Android project
        run: |
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          test -f index.html
          echo "Android project and web app are present."

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          test -s "$RUNNER_TEMP/release-keystore.jks"
          echo "Keystore restored."

      - name: Verify signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "Signing secrets are present."

      - name: Build signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew

          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release-keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

      - name: Find Release APK
        run: |
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No Release APK was produced."
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          cp "$APK" consistency-habit-tracker-v2.0.apk
          echo "APK created:"
          ls -lh consistency-habit-tracker-v2.0.apk

      - name: Verify APK signature
        run: |
          APK="$PWD/consistency-habit-tracker-v2.0.apk"

          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose "$APK"

          echo "APK signature verification passed."

      - name: Verify APK package
        run: |
          APK="$PWD/consistency-habit-tracker-v2.0.apk"

          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apkanalyzer" manifest application-id "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Consistency-Habit-Tracker-v2.0-Signed
          path: consistency-habit-tracker-v2.0.apk
          if-no-files-found: error
          retention-days: 30
