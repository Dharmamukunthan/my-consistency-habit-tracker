name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Create Capacitor project files
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "consistency-habit-tracker",
            "version": "2.0.0",
            "private": true,
            "scripts": {
              "build": "echo Web app is already built"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.consistency.habittracker",
            "appName": "Consistency Habit Tracker",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install
          npm install @capacitor/android@7.4.3

      - name: Prepare web files
        shell: bash
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp manifest.json www/
          cp icon.svg www/
          cp sw.js www/

          test -f www/index.html
          test -f www/manifest.json
          test -f www/icon.svg
          test -f www/sw.js

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Sync web app
        run: |
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64"

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks

          test -s android/app/release-key.jks

          echo "Keystore restored successfully."

      - name: Verify signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "Signing secrets are available."

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing_block = r'''
          signingConfigs {
              release {
                  storeFile file("release-key.jks")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }
          '''

          if "signingConfigs {" not in text:
              marker = "buildTypes {"
              if marker not in text:
                  raise SystemExit("Could not find buildTypes block in android/app/build.gradle")

              text = text.replace(
                  marker,
                  signing_block + "\n" + marker,
                  1
              )

          old_release = """release {
          minifyEnabled false
          proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
          }"""

          new_release = """release {
          signingConfig signingConfigs.release
          minifyEnabled false
          proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
          }"""

          if "signingConfig signingConfigs.release" not in text:
              if old_release in text:
                  text = text.replace(old_release, new_release, 1)
              else:
                  raise SystemExit(
                      "Could not safely find the generated release buildType. "
                      "No changes were made."
                  )

          path.write_text(text)
          PY

          echo "Checking release signing configuration..."
          grep -n "signingConfigs" android/app/build.gradle
          grep -n "signingConfig signingConfigs.release" android/app/build.gradle
          test -f android/app/release-key.jks

      - name: Build signed Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew clean assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)

          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: consistency-habit-tracker-v2-signed-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
