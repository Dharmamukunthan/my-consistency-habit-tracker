name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Create Capacitor project
        run: |
          cat > package.json <<'EOF'
          {
            "name": "consistency-habit-tracker",
            "version": "2.0.0",
            "private": true,
            "scripts": {
              "build": "echo Web app ready"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF

          npm install

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.consistency.habittracker",
            "appName": "Consistency Habit Tracker",
            "webDir": "www"
          }
          EOF

          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp icon.svg www/
          cp sw.js www/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release-key.jks

          cat > android/keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          header = '''import java.util.Properties
          import java.io.FileInputStream

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          '''

          if "keystoreProperties" not in text:
              text = header + text

          signing = '''    signingConfigs {
                  release {
                      storeFile file(keystoreProperties["storeFile"])
                      storePassword keystoreProperties["storePassword"]
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                  }
              }

              '''

          if "signingConfigs" not in text:
              text = text.replace("android {", "android {\n" + signing, 1)

          if "signingConfig signingConfigs.release" not in text:
              text = text.replace(
                  "buildTypes {",
                  "buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }\n",
                  1
              )

          p.write_text(text)
          PY

      - name: Build signed Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: consistency-habit-tracker-v2-signed
          path: android/app/build/outputs/apk/release/app-release.apk
