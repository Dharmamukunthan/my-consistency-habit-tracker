name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Create Capacitor project
        run: |
          cat > package.json <<'EOF'
          {
            "name": "consistency-habit-tracker",
            "version": "2.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.4",
              "@capacitor/android": "^7.4.4"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.4"
            }
          }
          EOF

          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp icon.svg www/
          cp sw.js www/

          npm install
          npx cap init "Consistency Habit Tracker" "com.dharmamukunthan.consistencyhabittracker" --web-dir www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          test -s android/app/release-key.jks
          echo "Keystore restored successfully."

      - name: Verify signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "Signing secrets are available."

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing = '''
          signingConfigs {
              release {
                  storeFile file("release-key.jks")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }
          '''

          if "signingConfigs {" not in text:
              text = text.replace("android {", "android {\n" + signing, 1)

          if "signingConfig signingConfigs.release" not in text:
              text = text.replace(
                  "release {",
                  "release {\n            signingConfig signingConfigs.release",
                  1
              )

          path.write_text(text)
          PY

          grep -q "signingConfigs" android/app/build.gradle
          grep -q "signingConfig signingConfigs.release" android/app/build.gradle

      - name: Build signed Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          echo "Signed Release APK created successfully."

      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: consistency-habit-tracker-v2-signed-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
